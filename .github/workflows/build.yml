name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Same signing key every build = updates install over the old version
      # without wiping the balance/history. Without the secret, each build gets
      # a random key and you'd have to uninstall before updating.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using persistent signing key"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret not set - APK signed with a throwaway key, updates will need an uninstall first"
          fi

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk kis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kis-apk
          path: kis.apk

      # Rolling "latest" release -> stable phone-friendly download link:
      # https://github.com/<you>/<repo>/releases/latest/download/kis.apk
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest kis.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build (#${GITHUB_RUN_NUMBER})" \
            --notes "Built from ${GITHUB_SHA::7}"
