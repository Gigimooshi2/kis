name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Same signing key every build = updates install over the old version
      # without wiping the balance/history. Without the secret, each build gets
      # a random key and you'd have to uninstall before updating.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kis.keystore"
            echo "KIS_KEYSTORE=$RUNNER_TEMP/kis.keystore" >> "$GITHUB_ENV"
            echo "Using persistent signing key"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret not set - APK signed with a throwaway key, updates will need an uninstall first"
          fi

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk kis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kis-apk
          path: kis.apk

      # One release per build, tagged v1.0.<run number>. The app reads the newest tag
      # to decide whether to update, so tags must keep increasing.
      # Stable download link for the newest build:
      # https://github.com/Gigimooshi2/kis/releases/latest/download/kis.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true   # old rolling release
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" kis.apk \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
          # keep the 10 newest releases
          gh release list --limit 100 --json tagName --jq '.[].tagName' | tail -n +11 \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
